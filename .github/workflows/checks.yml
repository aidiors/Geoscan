name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend python ../scripts/check_architecture.py
      - run: uv run --directory backend python ../scripts/check_docs.py
      - run: uv run --directory backend ruff format --check src tests benchmarks scenarios ../scripts
      - run: uv run --directory backend ruff check src tests benchmarks scenarios ../scripts
      - run: uv run --directory backend ty check src tests benchmarks scenarios ../scripts
      - run: uv run --directory backend pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:architecture
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: npm ci
      - run: uv sync --directory backend --locked
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
