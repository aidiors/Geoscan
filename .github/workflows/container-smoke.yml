name: Container smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag geoplan:ci .

      - name: Start container
        run: docker run --detach --name geoplan-ci --publish 8000:8000 geoplan:ci

      - name: Wait for health check
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs geoplan-ci
          exit 1

      - name: Verify web interface
        run: curl --fail --silent --show-error http://127.0.0.1:8000/ | grep --fixed-strings "GeoPlan"

      - name: Show logs on failure
        if: failure()
        run: docker logs geoplan-ci

      - name: Stop container
        if: always()
        run: docker rm --force geoplan-ci
